version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: aironauts-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: aironauts

  redis:
    image: redis:7.2-alpine
    container_name: aironauts-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aironauts-backend
    restart: on-failure
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/aironauts
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FROM_EMAIL: ${FROM_EMAIL:-recruiter@aironauts.ai}
    depends_on:
      - mongodb
      - redis

volumes:
  mongo-data:
  redis-data:
